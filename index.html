<script>
/* Apply saved theme and text size before first paint to avoid a flash. */
(function () {
  try {
    var d = JSON.parse(localStorage.getItem('amc-arena:v1') || '{}'), p = d.profile || {}, t = p.theme || 'auto';
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    if (p.fontScale) document.documentElement.style.setProperty('--fs', p.fontScale);
  } catch (e) {}
})();
</script>
